# Security updates only: open-pull-requests-limit 0 turns off the routine version-update pull
# requests, while Dependabot security updates for known vulnerabilities stay possible. The entries
# also tell GitHub which manifests to read (uv.lock and the workflow files). See docs/dependencies.md.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
