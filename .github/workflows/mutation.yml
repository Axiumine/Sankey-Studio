# Mutation testing on demand (mutmut 3.x over src/sankey_studio, score of at least 95), the same
# make targets as the `mutation` check of the release gate. It takes a long time on a hosted runner,
# so it has no schedule and never runs on a push or a pull request: start it by hand from the
# Actions tab (workflow_dispatch). Nothing requires it. See ADR-48.
name: mutation

on:
  workflow_dispatch:

permissions: {}

jobs:
  mutation-test:
    name: mutation-test (mutmut, score of at least 95)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install Node (the tests of the frontend modules run them with node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the locked environment
        run: uv sync --all-extras --locked

      - name: Mutate (one worker per vCPU of a public-repository runner)
        run: make mutate MUTATE_CHILDREN=4

      - name: Mutation score gate
        run: make mutate-gate

      - name: Keep the mutant results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-meta
          path: mutants/**/*.meta
          if-no-files-found: warn
          retention-days: 14
