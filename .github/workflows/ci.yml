# Hosted tests, part 1: lint, strict types, code caps and the unit suite with its 100% line and
# branch coverage gate (job test), and the memory budgets (job memory-test), through the same make
# targets the git hooks use (docs/quality.md). The browser and MongoDB suites are in ci-e2e.yml,
# Semgrep and Trivy in ci-security.yml, mutation testing (on demand) in mutation.yml. A skipped test fails
# a job here as it does in the hooks, except the 8 mongo-marked unit tests, which need a real
# MongoDB (ci-e2e.yml runs them). See ADR-44 and ADR-48.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install Node (the tests of the frontend modules run them with node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the locked environment
        run: uv sync --all-extras --locked

      - name: Lint, strict types and code caps
        run: make lint typecheck caps

      - name: Unit tests with the coverage gate
        run: make cov JUNIT=reports/junit/cov.xml

      - name: No test was skipped (only the mongo-marked ones may be)
        uses: ./.github/actions/no-skipped-tests
        with:
          reports: reports/junit
          allow: SANKEY_TEST_MONGO_URI

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            reports/junit/cov.xml
            reports/coverage/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  memory-test:
    name: memory-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install the locked environment
        run: uv sync --all-extras --locked

      - name: Memory budgets (pytest-memray)
        run: make memray JUNIT=reports/junit/memray.xml

      - name: No test was skipped
        uses: ./.github/actions/no-skipped-tests
        with:
          reports: reports/junit

      - name: Keep the memory report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-report
          path: reports/junit/memray.xml
          if-no-files-found: warn
          retention-days: 14
