# Hosted end-to-end tests through the make targets the git hooks use (docs/e2e.md):
#  - e2e: the browser and HTTP suites against the app on a loopback port (mongomock), in the five
#    shards of `make e2e`, one runner each. Chrome is the one preinstalled on the runner image
#    (Playwright channel "chrome"), headless, started with --no-sandbox by the harness.
#  - e2e-mongo: the same flows against a real MongoDB 8 (`make e2e-mongo`), as a service container
#    on 127.0.0.1:27117, the port of docker-compose.yml. The replica-set suite (e2e-mongo-rs) is the
#    maintainer's private LAN cluster and never runs here.
# A skipped test fails a job, as in the hooks. Nothing requires these jobs to pass. See ADR-48.
name: ci-e2e

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: e2e (shard ${{ matrix.shard }} of 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the list and E2E_SHARDS below in step: shard N runs E2E_SHARD=N/E2E_SHARDS.
        shard: [1, 2, 3, 4, 5]
    env:
      E2E_SHARDS: "5"
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/reports/e2e-artifacts
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install the locked environment
        run: uv sync --all-extras --locked

      - name: The browser the tests will drive
        # Playwright's "chrome" channel looks for exactly this path. No fallback download: a missing
        # Chrome must fail here with a clear message, not turn every browser test into a skip.
        run: |
          test -x /opt/google/chrome/chrome || {
            echo "::error::no Google Chrome at /opt/google/chrome/chrome (Playwright channel chrome)"
            exit 1
          }
          /opt/google/chrome/chrome --version

      - name: Allow the private network namespace of scripts/netns.sh
        # Ubuntu 24.04 lets an unprivileged process create a user namespace but takes its capabilities
        # away (AppArmor), so `ip link set lo up` inside it fails and netns.sh falls back to the host
        # network. The runner is a throw-away VM: the setting lasts until it is deleted. The last line
        # shows the result: only `lo` means the namespace works, `eth0` and a note mean the fallback.
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "::warning::could not lift the user namespace restriction"
          scripts/netns.sh ip -brief link

      - name: End-to-end tests, one shard
        env:
          SHARD: ${{ matrix.shard }}
        run: make "e2e-shard-${SHARD}" E2E_SHARDS="${E2E_SHARDS}" JUNIT=reports/junit/e2e.xml

      - name: No test was skipped
        uses: ./.github/actions/no-skipped-tests
        with:
          reports: reports/junit

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: reports/junit/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the screenshots and traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: reports/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e-mongo:
    name: e2e-mongo (real MongoDB 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      mongo:
        # mongo:8 as pinned on 2026-10-18; refresh with: docker buildx imagetools inspect mongo:8
        image: mongo:8@sha256:0e900a3364da37b76d642b73b0bba56bd4c6c509ab470cf700436fd866bee3ff
        ports: ["127.0.0.1:27117:27017"]
        # The runner waits for "healthy" before the first step. `mongosh --eval 1` fails while the
        # server does not accept connections.
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-start-period 10s
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install the locked environment
        run: uv sync --all-extras --locked

      - name: The server answers a ping from the host
        run: uv run python scripts/mongo_wait.py --uri mongodb://127.0.0.1:27117 --timeout 60

      - name: Real-MongoDB flows, then the mongo-marked unit tests
        env:
          SANKEY_TEST_MONGO_URI: mongodb://127.0.0.1:27117
        run: make e2e-mongo JUNIT=reports/junit/mongo.xml

      - name: No test was skipped
        uses: ./.github/actions/no-skipped-tests
        with:
          reports: reports/junit

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-mongo-report
          path: reports/junit/
          if-no-files-found: warn
          retention-days: 14

      - name: Log of the MongoDB container
        if: failure()
        run: docker ps -a -q | xargs -r -n1 docker logs --tail 80
