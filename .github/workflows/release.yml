# Publishes a release to PyPI when a version tag is pushed. This is the only workflow of the
# project: it checks nothing about the code (the git hooks do that before the tag is pushed) and
# only builds, smoke-tests and uploads the distribution. See docs/release.md.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: The tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} does not match version ${version}"; exit 1; }

      - name: Build the sdist and the wheel
        run: uv build --out-dir dist

      - name: Check the metadata and the README rendering
        run: uvx twine check --strict dist/*

      - name: The wheel installs and starts in a clean environment
        run: uv tool run --from ./dist/*.whl --python 3.14 sankey-studio --help

      - name: Keep the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Upload to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sankey-studio
    permissions:
      id-token: write
    steps:
      - name: Fetch the distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload to PyPI
    # Runs after TestPyPI. Give the "pypi" environment a required reviewer to pause here, install
    # the TestPyPI files, and approve the upload by hand.
    needs: testpypi
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/sankey-studio
    permissions:
      id-token: write
    steps:
      - name: Fetch the distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
